name: Construire l'APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/notifier.py'
      - 'scripts/reclasser.py'
      - '.github/workflows/reclasser.yml'
      - '.github/workflows/notifier.yml'
      - 'firestore.rules'
      - 'README.md'
      - 'scripts/prepare_web.py'
      - 'scripts/config_web.py'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Créer le projet Android
        run: flutter create --org sn.lfakebemer --project-name lfanews --platforms android --no-pub app_build

      - name: Copier le code de l'application
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          rm -rf app_build/lib app_build/test
          cp -r lib app_build/lib
          cp -r assets app_build/assets
          cp pubspec.yaml app_build/pubspec.yaml
          python3 scripts/prepare.py
          echo "$KEYSTORE_B64" | base64 -d > app_build/android/app/upload.jks

      - name: Construire l'APK
        working-directory: app_build
        shell: bash
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          flutter pub get 2>&1 | tee /tmp/build_log.txt
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee -a /tmp/build_log.txt

      - name: Conserver le journal en cas d'échec
        if: failure()
        run: |
          {
            echo "=== Lignes d'erreur ==="
            grep -nE "Error|error:|Exception|FAILURE|What went wrong" /tmp/build_log.txt | head -80
            echo
            echo "=== Fin du journal ==="
            tail -n 120 /tmp/build_log.txt
          } > /tmp/resume.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan journal
          git rm -rf --quiet . || true
          cp /tmp/resume.txt build_log.txt
          git add build_log.txt
          git commit -q -m "Journal de construction ${{ github.run_number }}"
          git push -f origin journal

      - uses: actions/upload-artifact@v4
        with:
          name: LFANEWS-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Préparer le nom de la version
        id: version
        run: |
          V=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp app_build/build/app/outputs/flutter-apk/app-release.apk "LFANEWS-$V.apk"

      - name: Publier la version (lien public de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LFANEWS ${{ steps.version.outputs.version }}
          files: LFANEWS-${{ steps.version.outputs.version }}.apk
          make_latest: true
