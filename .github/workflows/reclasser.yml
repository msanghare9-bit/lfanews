name: Reclasser les anciens articles

on:
  workflow_dispatch:

jobs:
  reclasser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-auth requests
      - run: python3 scripts/reclasser.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
